name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token; actions and base images are pinned by SHA/digest. Nothing is uploaded as an artifact.
permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements.txt
      - run: ruff check backend tests simulator
      - run: pytest -q

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - name: No dangerouslySetInnerHTML
        run: "! grep -rn dangerouslySetInnerHTML src"

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -f backend/Dockerfile -t sentinelstream-backend .
      - run: docker build -t sentinelstream-frontend frontend
